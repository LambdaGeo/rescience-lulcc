abstract: "Moulds, Buytaert and Mijic (2015) presented lulcc, an R package for land use change modelling, and demonstrated it on the Plum Island Ecosystems data set: logistic regression suitability, demand by interpolation, CLUE-S and ordered allocation, and validation by three-map comparison. We replicate that application in Python, on the DisSModel framework, with the CLUE-S allocation of DisSLUCC, which derives from LuccME and was written independently of lulcc. We compare at two levels. Given the same inputs, our CLUE-S and ordered allocations reproduce every one of lulcc's simulated maps cell by cell, and our validation tables agree to 1e-16. With independent random numbers, 30 runs of each implementation agree in distribution on all 20 metrics we compared, under criteria recorded before the runs. Running the original demonstration script on current R required one change: the data set's raster objects, serialised by an old version of the raster package, make the allocation stop with a CRS error and had to be rebuilt."

